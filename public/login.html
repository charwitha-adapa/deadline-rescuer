<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f3efff"><meta name="robots" content="noindex,nofollow"><title>Sign in · Deadline Rescuer</title><link rel="stylesheet" href="/theme.css"><script src="/theme.js"></script><style>body{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 10%,#e9e5ff,transparent 36%),var(--bg)}main{width:min(100%,420px);background:#ffffffed;border:1px solid var(--border);padding:34px;border-radius:24px;box-shadow:0 24px 70px #25204d12}.brand{margin-bottom:34px}h1{font-size:29px;letter-spacing:-.05em;margin:0 0 8px}.sub{color:var(--text-dim);line-height:1.6;margin:0 0 24px}input,button{width:100%;height:48px;border-radius:12px}input{border:1px solid var(--border);padding:0 14px;background:white;margin:6px 0}button{border:0;background:var(--brand);color:white;font-weight:700;margin-top:10px}.secondary{background:transparent;color:var(--text-dim)}.msg{font-size:13px;min-height:20px;color:var(--text-dim)}.msg.err{color:var(--danger)}[hidden]{display:none!important}</style></head><body><button class="theme-toggle page-theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark mode" title="Switch to dark mode" aria-pressed="false"><span class="theme-toggle-icon" aria-hidden="true">☾</span><span class="theme-toggle-label">Dark mode</span></button><main><div class="brand"><span class="brand-mark">↗</span><span>Deadline Rescuer</span></div><h1 id="heading">Your time, back in control.</h1><p class="sub" id="sub">Sign in with your email. We'll send you a one-time code — no password needed.</p><form id="form"><input id="email" type="email" placeholder="you@example.com" autocomplete="username webauthn" required><input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code" hidden><button id="submit">Continue with email</button><button id="back" type="button" class="secondary" hidden>Use another email</button></form><section id="passkey" hidden><p class="sub">Want faster sign-ins next time? Save a passkey using your device's fingerprint, face, or screen lock.</p><button id="add">Add a passkey</button><button id="skip" class="secondary">Not now</button></section><p class="msg" id="msg" role="status" aria-live="polite"></p></main><script>
(()=>{const A=window.hatchable&&window.hatchable.auth,form=document.querySelector('#form'),email=document.querySelector('#email'),code=document.querySelector('#code'),submit=document.querySelector('#submit'),back=document.querySelector('#back'),msg=document.querySelector('#msg'),passkey=document.querySelector('#passkey');let step='email',hasPasskey=false;const next=()=>{const n=new URLSearchParams(location.search).get('next')||'/';return n.startsWith('/')&&!n.startsWith('//')&&!n.includes('\\')?n:'/'};const say=(s,err=false)=>{msg.textContent=s;msg.className='msg'+(err?' err':'')};if(!A){say('Sign-in is unavailable. Please refresh.',true);submit.disabled=true;return}A.getSession().then(s=>{if(s&&s.user)location.replace(next())}).catch(()=>{});form.addEventListener('submit',async e=>{e.preventDefault();submit.disabled=true;try{if(step==='email'){const r=await A.startLogin({email:email.value.trim()});hasPasskey=!!r.has_passkey;if(hasPasskey&&A.supportsPasskeys()){try{const p=await A.signInWithPasskey({email:email.value.trim()});if(p&&p.user){location.replace(next());return}}catch(_){}}step='code';code.hidden=false;back.hidden=false;email.readOnly=true;submit.textContent='Verify code';say('Check your inbox for the 6-digit code.')}else{const r=await A.verifyCode({email:email.value.trim(),code:code.value.trim()});if(!r||!r.user)throw Error('That code did not work. Try again.');form.hidden=true;if(!hasPasskey&&A.supportsPasskeys()&&localStorage.getItem('deadline-passkey-declined')!=='1'){passkey.hidden=false;say('Signed in successfully.')}else location.replace(next())}}catch(err){say(err.message||'Something went wrong. Try again.',true)}finally{submit.disabled=false}});back.addEventListener('click',()=>{step='email';code.hidden=true;back.hidden=true;email.readOnly=false;code.value='';submit.textContent='Continue with email';say('')});document.querySelector('#add').addEventListener('click',async()=>{try{await A.registerPasskey()}catch(e){say(e.message||'Could not save passkey.',true)}location.replace(next())});document.querySelector('#skip').addEventListener('click',()=>{localStorage.setItem('deadline-passkey-declined','1');location.replace(next())});})();
</script></body></html>
